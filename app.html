<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Bakımda | Cipher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 50px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }

        /* Easter Egg için cursor değişimi */
        .cipher-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #00ff88;
            animation: pulse 2s infinite;
            cursor: help; 
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            transition: opacity 0.3s;
        }

        p {
            color: #888;
            font-size: 1.1rem;
        }

        .loader {
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        /* Gizli Stil */
        .tesseract-mode {
            color: #ff0055 !important;
            text-shadow: 0 0 10px #ff0055;
        }
    </style>
</head>
<body>

<div class="container" id="main-box">
    <div class="cipher-icon" id="easter-egg-trigger">◈</div>
    <h1 id="main-title">CIPHER SİSTEMLERİ</h1>
    <p id="sub-text">Şu an sistem genelinde planlı bir bakım çalışması yapılıyor.</p>
    <div class="loader"></div>
    <p><small id="small-text">Kısa süre içinde tekrar online olacağız.</small></p>
</div>

<script>
    const icon = document.getElementById('easter-egg-trigger');
    const title = document.getElementById('main-title');
    const subText = document.getElementById('sub-text');
    const smallText = document.getElementById('small-text');

    // Konsol sürprizi
    console.log("%c[SYSTEM]: %cDon't let me leave, Murph!", "color: #00ff88; font-weight: bold;", "color: #888;");

    // Tıklama sürprizi
    let clickCount = 0;
    icon.addEventListener('click', () => {
        clickCount++;
        
        if(clickCount === 5) {
            title.innerText = "BİZ KENDİMİZİ SEÇTİK";
            subText.innerText = "Geçmişi değiştirmek için değil, bir yol bulmak için buradayız.";
            smallText.innerText = "Tesserakt senkronize ediliyor...";
            icon.classList.add('tesseract-mode');
            
            setTimeout(() => {
                title.innerText = "CIPHER SİSTEMLERİ";
                subText.innerText = "Şu an sistem genelinde planlı bir bakım çalışması yapılıyor.";
                smallText.innerText = "Kısa süre içinde tekrar online olacağız.";
                icon.classList.remove('tesseract-mode');
                clickCount = 0;
            }, 4000);
        }
    });
</script>

</body>
</html>
