<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIPHER | Bakım Modu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f0f1a; /* Cipher koyu tema */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
            color: #00ff9d; /* Cipher yeşili */
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #a0a0c0;
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(0, 255, 157, 0.1);
            color: #00ff9d;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #00ff9d;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 157, 0.1);
            border-radius: 50%;
            border-top-color: #00ff9d;
            margin: 30px auto;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🔒</div>
        <h1>CIPHER v3</h1>
        <p>Sistem güvenliği ve kullanıcı veritabanı senkronizasyonu için kısa bir <b>bakım molası</b> verdik. Giriş ve kayıt işlemleri şu an optimize ediliyor.</p>
        
        <div class="status-badge">DURUM: GÜNCELLEME YAPILIYOR</div>
        
        <div class="loader"></div>
        
        <p style="font-size: 0.8rem; opacity: 0.6;">Anlayışınız için teşekkür ederiz. Çok yakında tekrar yayındayız.</p>
    </div>

</body>
</html>
