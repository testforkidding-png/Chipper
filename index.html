<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#00FFB3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CIPHER">
  <title>CIPHER — Giriş</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{c:{bg:'#06080F',surf:'#0C1220',elev:'#131D30',border:'#1E2D45',accent:'#00FFB3',text:'#DDE8F8',muted:'#7A8FA8',danger:'#FF3D6B'}}},fontFamily:{display:['Syne','sans-serif'],body:['DM Sans','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
  <style>
    html,body{height:100%;overflow:auto;}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;}
    .input-field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #1E2D45;background:#06080F;color:#DDE8F8;font-size:15px;transition:border-color .2s;-webkit-appearance:none;}
    .input-field:focus{border-color:#00FFB3;}
    .input-field::placeholder{color:#3A4A5A;}
    .btn-primary{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#00FFB3,#00C48A);color:#062B1F;font-weight:700;font-size:16px;font-family:Syne,sans-serif;cursor:pointer;transition:opacity .15s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none;}
    .btn-primary:hover{opacity:.92;}
    .btn-primary:active{transform:scale(.97);}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-family:'JetBrains Mono',monospace;}
    /* Animated background orbs */
    .orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;animation:pulseDot 6s infinite;}
    .orb-1{width:350px;height:350px;background:rgba(0,255,179,.08);top:-80px;left:-80px;}
    .orb-2{width:250px;height:250px;background:rgba(0,102,255,.07);bottom:0;right:-50px;animation-delay:3s;}
    /* Lock icon animation */
    @keyframes lockBounce{0%{transform:rotate(-8deg) scale(.95)}50%{transform:rotate(4deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
    .lock-icon{animation:lockBounce .7s cubic-bezier(.34,1.56,.64,1) forwards;}
  </style>
</head>
<body class="grid-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="relative w-full" style="max-width:400px">

    <!-- Logo section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 lock-icon glow-sm" style="background:linear-gradient(135deg,#00FFB3,#00C48A)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06080F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="text-4xl font-black tracking-tight mb-1" style="font-family:Syne,sans-serif;color:#DDE8F8;letter-spacing:-1px">CIPHER</h1>
      <p class="text-xs font-mono" style="color:#7A8FA8;letter-spacing:.15em">ÖZEL · ŞİFRELİ · GÜVENLİ</p>
    </div>

    <!-- Login card -->
    <div class="rounded-2xl p-7 glow-accent" style="background:#0C1220;border:1px solid #1E2D45">
      <h2 class="text-xl font-bold mb-6" style="font-family:Syne,sans-serif;color:#DDE8F8">Hesabınıza Giriş Yapın</h2>

      <!-- Username -->
      <div class="mb-4">
        <label class="block text-xs font-semibold mb-2 font-mono" style="color:#7A8FA8;letter-spacing:.08em">KULLANICI ADI</label>
        <input id="username" type="text" class="input-field" placeholder="kullanici_adi" autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false"
          onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
      </div>

      <!-- Password -->
      <div class="mb-5">
        <label class="block text-xs font-semibold mb-2 font-mono" style="color:#7A8FA8;letter-spacing:.08em">ŞİFRE</label>
        <div style="position:relative">
          <input id="password" type="password" class="input-field" placeholder="••••••••" autocomplete="current-password" style="padding-right:50px"
            onkeydown="if(event.key==='Enter')doLogin()">
          <button id="eye-btn" onclick="togglePwd()" type="button"
            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#7A8FA8;background:none;border:none;cursor:pointer;padding:4px;border-radius:6px;transition:color .15s"
            onmouseenter="this.style.color='#DDE8F8'" onmouseleave="this.style.color='#7A8FA8'">
            <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Error message -->
      <div id="login-err" class="hidden mb-4 px-4 py-3 rounded-xl text-sm" style="background:rgba(255,61,107,.1);color:#FF3D6B;border:1px solid rgba(255,61,107,.25)"></div>

      <!-- Login button -->
      <button id="login-btn" onclick="doLogin()" class="btn-primary mb-4">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Güvenli Giriş
      </button>

      <!-- Security badges -->
      <div class="flex flex-wrap items-center justify-center gap-2 pt-4" style="border-top:1px solid #1E2D45">
        <span class="badge" style="background:rgba(0,255,179,.08);color:#00FFB3;border:1px solid rgba(0,255,179,.2)">🔒 AES-256</span>
        <span class="badge" style="background:rgba(0,102,255,.08);color:#60A5FA;border:1px solid rgba(0,102,255,.2)">🛡 Zero-Log</span>
        <span class="badge" style="background:rgba(255,165,53,.08);color:#FFA535;border:1px solid rgba(255,165,53,.2)">💣 Self-Destruct</span>
      </div>
    </div>

    <!-- Demo accounts -->
    <div class="mt-5 rounded-2xl p-4" style="background:#0C1220;border:1px solid #1E2D45">
      <p class="text-xs font-semibold mb-3 font-mono text-center" style="color:#7A8FA8;letter-spacing:.08em">DEMO HESAPLARI</p>
      <div class="flex gap-2">
        <button onclick="fill('admin','admin123')" class="flex-1 py-2.5 rounded-xl text-sm transition-all" style="background:#131D30;color:#DDE8F8;border:1px solid #1E2D45" onmouseenter="this.style.borderColor='#00FFB3'" onmouseleave="this.style.borderColor='#1E2D45'">
          <div class="font-semibold" style="font-family:Syne,sans-serif">admin</div>
          <div class="text-xs font-mono" style="color:#FFD700">⚡ Yönetici</div>
        </button>
        <button onclick="fill('alice','alice123')" class="flex-1 py-2.5 rounded-xl text-sm transition-all" style="background:#131D30;color:#DDE8F8;border:1px solid #1E2D45" onmouseenter="this.style.borderColor='#00FFB3'" onmouseleave="this.style.borderColor='#1E2D45'">
          <div class="font-semibold" style="font-family:Syne,sans-serif">alice</div>
          <div class="text-xs font-mono" style="color:#7A8FA8">🎨 Tasarımcı</div>
        </button>
        <button onclick="fill('marcus','marcus123')" class="flex-1 py-2.5 rounded-xl text-sm transition-all" style="background:#131D30;color:#DDE8F8;border:1px solid #1E2D45" onmouseenter="this.style.borderColor='#00FFB3'" onmouseleave="this.style.borderColor='#1E2D45'">
          <div class="font-semibold" style="font-family:Syne,sans-serif">marcus</div>
          <div class="text-xs font-mono" style="color:#7A8FA8">💻 Dev</div>
        </button>
      </div>
    </div>

    <!-- Admin link -->
    <p class="text-center text-xs mt-4" style="color:#3A4A5A">
      Yönetici paneli: <a href="admin.html?key=cipher-admin-2024" style="color:#7A8FA8;text-decoration:underline">admin.html</a>
    </p>
  </div>

  <!-- Toast -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none flex flex-col items-end"></div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    DB.init();
    if (Auth.getSession()) window.location.href = 'app.html';

    async function doLogin() {
      const btn = document.getElementById('login-btn');
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      if (!u||!p) { showErr('Kullanıcı adı ve şifre girin.'); return; }
      btn.innerHTML='<svg class="animate-spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg>';
      btn.disabled=true;
      try {
        await Auth.login(u, p);
        btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Giriş Yapıldı!';
        setTimeout(()=>window.location.href='app.html', 400);
      } catch(e) {
        showErr(e.message);
        btn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Güvenli Giriş';
        btn.disabled=false;
      }
    }

    function showErr(msg) {
      const el=document.getElementById('login-err');
      el.textContent=msg; el.classList.remove('hidden');
      setTimeout(()=>el.classList.add('hidden'),4000);
    }

    function togglePwd() {
      const inp=document.getElementById('password');
      const open=document.getElementById('eye-open');
      const closed=document.getElementById('eye-closed');
      if(inp.type==='password'){inp.type='text';open.classList.add('hidden');closed.classList.remove('hidden');}
      else{inp.type='password';open.classList.remove('hidden');closed.classList.add('hidden');}
    }

    function fill(u,p) {
      document.getElementById('username').value=u;
      document.getElementById('password').value=p;
      document.getElementById('password').focus();
    }

    // Register SW
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
