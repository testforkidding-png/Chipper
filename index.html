<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Bakımda | Cipher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            border: 1px solid #333;
            padding: 50px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .cipher-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #00ff88; /* Neon yeşil dokunuşu */
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            color: #888;
            font-size: 1.1rem;
        }

        .loader {
            border: 3px solid #333;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="cipher-icon">◈</div>
    <h1>CIPHER SİSTEMLERİ</h1>
    <p>Şu an sistem genelinde planlı bir bakım çalışması yapılıyor.</p>
    <div class="loader"></div>
    <p><small>Kısa süre içinde tekrar online olacağız.</small></p>
</div>

</body>
</html>
