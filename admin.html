<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CIPHER Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{background:#06080F;color:#DDE8F8;font-family:'DM Sans',sans-serif;padding:0;margin:0;}
    .section{background:#0C1220;border:1px solid #1E2D45;border-radius:16px;padding:20px;margin-bottom:16px;}
    .field{width:100%;padding:10px;border-radius:10px;border:1.5px solid #1E2D45;background:#06080F;color:#DDE8F8;font-size:13px;outline:none;}
    .field:focus{border-color:#00FFB3;}
    .btn{padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer;transition:0.2s;}
    .btn-green{background:#00FFB3;color:#062B1F;}
    .btn-blue{background:#1E2D45;color:#DDE8F8;font-size:11px;}
    .user-card{background:#06080F;border:1px solid #1E2D45;border-radius:12px;padding:12px;margin-bottom:8px;}
    .hidden { display: none; }
  </style>
</head>
<body>

<div id="auth-gate" class="fixed inset-0 flex items-center justify-center bg-[#06080F] z-50">
  <div class="w-full max-w-xs p-6 section">
    <h1 class="text-center font-bold mb-4">ADMİN GİRİŞİ</h1>
    <input id="admin-pw" type="password" class="field mb-4" placeholder="Anahtar...">
    <button onclick="login()" class="btn btn-green w-full">Giriş</button>
  </div>
</div>

<div id="main-panel" class="hidden p-4 max-w-2xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold" style="font-family:Syne">CIPHER Admin</h1>
    <a href="index.html" class="text-xs text-gray-500">← Uygulamaya Dön</a>
  </div>

  <div class="section">
    <h2 class="font-bold mb-4">➕ Yeni Kullanıcı Tanımla</h2>
    <div class="grid grid-cols-2 gap-3">
      <input id="new-u" class="field" placeholder="Kullanıcı Adı">
      <input id="new-p" type="password" class="field" placeholder="Şifre">
    </div>
    <button onclick="addUser()" class="btn btn-green w-full mt-4">Kullanıcıyı Kaydet</button>
  </div>

  <div class="section">
    <h2 class="font-bold mb-4">👥 Kullanıcı Yönetimi & Şifre Güncelleme</h2>
    <div id="user-list"></div>
  </div>
</div>

<div id="toast-container" style="position:fixed;bottom:20px;right:20px"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>

<script>
  function login() {
    if(document.getElementById('admin-pw').value === '1453' || document.getElementById('admin-pw').value === CONFIG.ADMIN_KEY) {
      document.getElementById('auth-gate').classList.add('hidden');
      document.getElementById('main-panel').classList.remove('hidden');
      loadUsers();
    } else { alert('Hatalı!'); }
  }

  async function loadUsers() {
    const users = await DB.getAllUsers();
    const list = document.getElementById('user-list');
    list.innerHTML = '';
    users.forEach(u => {
      if(u.username === 'cipher_bot') return;
      const div = document.createElement('div');
      div.className = 'user-card';
      div.innerHTML = `
        <div class="flex justify-between items-center mb-3">
          <div>
            <div class="font-bold">@${u.username}</div>
            <div class="text-[10px] text-gray-500">Kayıt: ${new Date(u.created_at).toLocaleDateString()}</div>
          </div>
          <button onclick="deleteUser('${u.username}')" class="text-red-500 text-xs">Sil</button>
        </div>
        <div class="flex gap-2">
          <input id="pw-${u.username}" type="password" class="field h-8 text-xs" placeholder="Yeni Şifre">
          <button onclick="changePassword('${u.username}')" class="btn btn-blue whitespace-nowrap">Şifreyi Değiştir</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  async function addUser() {
    const u = document.getElementById('new-u').value.trim().toLowerCase();
    const p = document.getElementById('new-p').value;
    if(!u || !p) return UI.toast('Eksik alan','error');
    
    const hash = await DB._sha256(p);
    await DB.createUser({ username: u, password_hash: hash, display_name: u, created_at: Date.now() });
    UI.toast('Eklendi');
    document.getElementById('new-u').value=''; document.getElementById('new-p').value='';
    loadUsers();
  }

  async function changePassword(username) {
    const newPw = document.getElementById(`pw-${username}`).value;
    if(!newPw) return UI.toast('Şifre boş olamaz','error');
    
    const hash = await DB._sha256(newPw);
    const user = await DB.getUser(username);
    user.password_hash = hash;
    // Eski sistemden kalma bozukluk varsa temizle
    if(user.password_hash_broken) delete user.password_hash_broken;
    
    await DB.updateUser(username, user);
    UI.toast('Şifre güncellendi');
    document.getElementById(`pw-${username}`).value = '';
  }

  async function deleteUser(u) { if(confirm('Emin misin?')) { await DB.deleteUser(u); loadUsers(); } }
</script>
</body>
</html>
