<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CIPHER Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html,body{height:auto;overflow:auto;}
    body{min-height:100vh;background:#06080F;color:#DDE8F8;padding:0;}
    .field{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #1E2D45;background:#06080F;color:#DDE8F8;font-size:13px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif;}
    .field:focus{border-color:#00FFB3;}
    .btn-green{padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#00FFB3,#00C48A);color:#062B1F;font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:Syne,sans-serif;transition:opacity .15s;}
    .section{background:#0C1220;border:1px solid #1E2D45;border-radius:16px;padding:20px;margin-bottom:20px;}
    .label{display:block;font-size:10px;font-weight:600;color:#7A8FA8;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;margin-bottom:6px;}
    pre{white-space:pre-wrap;word-break:break-all;}
    .hidden { display: none; }
  </style>
</head>
<body class="grid-bg">

<div id="admin-auth" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#06080F">
  <div style="width:100%;max-width:380px;padding:20px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#FFD700,#FFA500);margin-bottom:12px;font-size:26px">⚡</div>
      <div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:#DDE8F8">CIPHER Admin</div>
    </div>
    <div class="section">
      <label class="label">ADMİN ANAHTARI</label>
      <input id="admin-key-input" type="password" class="field" placeholder="Şifre: 1453" onkeydown="if(event.key==='Enter')checkAdminKey()">
      <button onclick="checkAdminKey()" class="btn-green" style="width:100%;margin-top:12px">Giriş Yap</button>
    </div>
  </div>
</div>

<div id="admin-panel" class="hidden">
  <div style="border-bottom:1px solid #1E2D45;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:#0C1220;position:sticky;top:0;z-index:10">
    <div style="display:flex;align-items:center;gap:10px">
        <div style="font-family:Syne,sans-serif;font-weight:700;font-size:15px">CIPHER Panel</div>
        <span id="user-count-badge" style="font-size:10px;padding:2px 8px;background:#131D30;color:#00FFB3;border-radius:10px">0</span>
    </div>
    <a href="index.html" style="font-size:12px;color:#7A8FA8">← Uygulamaya Dön</a>
  </div>

  <div style="max-width:860px;margin:0 auto;padding:20px">
    
    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">➕ Yeni Kullanıcı</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <input id="new-username" class="field" placeholder="Kullanıcı Adı">
        <input id="new-displayname" class="field" placeholder="Görünen Ad">
        <input id="new-password" type="password" class="field" placeholder="Şifre">
        <select id="new-role" class="field">
            <option value="user">Kullanıcı</option>
            <option value="admin">Yönetici</option>
        </select>
      </div>
      <button onclick="addUser()" class="btn-green" style="margin-top:14px">Kaydet</button>
    </div>

    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">👥 Kullanıcı Listesi</h2>
      <div id="users-table" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between">
        <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">🚨 Şikayetler</h2>
        <button onclick="clearReports()" style="color:#FF3D6B;font-size:11px">Temizle</button>
      </div>
      <div id="reports-list"></div>
    </div>

    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">🤖 Toplu Mesaj</h2>
      <textarea id="bot-msg" class="field" placeholder="Tüm kullanıcılara gidecek mesaj..." rows="3"></textarea>
      <button onclick="sendBotMessage()" class="btn-green" style="margin-top:10px;width:100%">Bot Olarak Gönder</button>
    </div>

  </div>
</div>

<div id="toast-container" style="position:fixed;bottom:20px;right:16px;z-index:200"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>

<script>
  // Şifre Giriş Kontrolü
  function checkAdminKey() {
    const k = document.getElementById('admin-key-input').value;
    if (k === '1453' || k === CONFIG.ADMIN_KEY) {
      document.getElementById('admin-auth').style.display='none';
      document.getElementById('admin-panel').classList.remove('hidden');
      loadUsers();
      loadReports();
    } else {
      alert('Hatalı Anahtar!');
    }
  }

  // Kullanıcı Listeleme
  async function loadUsers() {
    const users = await DB.getAllUsers();
    const table = document.getElementById('users-table');
    document.getElementById('user-count-badge').textContent = users.length;
    table.innerHTML = '';
    
    users.forEach(u => {
      const div = document.createElement('div');
      div.style.cssText = 'padding:12px;background:#06080F;border:1px solid #1E2D45;border-radius:12px;display:flex;justify-content:space-between;align-items:center';
      div.innerHTML = `
        <div>
          <div style="font-weight:700">${u.display_name || u.username} ${u.is_admin ? '⭐':''}</div>
          <div style="font-size:11px;color:#7A8FA8">@${u.username}</div>
        </div>
        <button onclick="deleteUser('${u.username}')" style="color:#FF3D6B">Sil</button>
      `;
      table.appendChild(div);
    });
  }

  // Kullanıcı Ekleme (KRİTİK DÜZELTME)
  async function addUser() {
    const u = document.getElementById('new-username').value.trim().toLowerCase();
    const d = document.getElementById('new-displayname').value.trim();
    const p = document.getElementById('new-password').value;
    const r = document.getElementById('new-role').value;

    if(!u || !p) return UI.toast('Eksik alan!','error');

    // Şifreyi db.js'deki SHA256 ile hesaplıyoruz (Auth.js ile tam uyumlu)
    const hash = await DB._sha256(p);
    
    await DB.createUser({
      username: u,
      password_hash: hash,
      display_name: d || u,
      is_admin: r === 'admin',
      created_at: Date.now()
    });

    UI.toast('Kullanıcı eklendi','success');
    loadUsers();
  }

  async function deleteUser(uname) {
    if(confirm('Emin misin?')) {
      await DB.deleteUser(uname);
      loadUsers();
    }
  }

  // Raporlar
  function loadReports() {
    const reports = JSON.parse(localStorage.getItem('cipher_admin_reports') || '[]');
    const list = document.getElementById('reports-list');
    if(!reports.length) { list.innerHTML = '<div style="color:#7A8FA8;text-align:center">Rapor yok.</div>'; return; }
    
    list.innerHTML = reports.map(r => `
      <div style="background:#06080F;padding:10px;border-radius:10px;margin-bottom:8px;font-size:12px;border:1px solid #1E2D45">
        <span style="color:#00FFB3">@${r.from}</span>: ${r.text}
      </div>
    `).join('');
  }

  function clearReports() {
    localStorage.removeItem('cipher_admin_reports');
    loadReports();
  }

  // Bot Mesajı
  async function sendBotMessage() {
    const msg = document.getElementById('bot-msg').value.trim();
    if(!msg) return;
    const users = await DB.getAllUsers();
    for(const u of users) {
      if(u.username === 'cipher_bot') continue;
      const convId = ['cipher_bot', u.username].sort().join('_');
      await DB.createMessage({
        conv_id: convId, from: 'cipher_bot', text: '🤖 ' + msg, created_at: Date.now()
      });
    }
    UI.toast('Mesaj tüm kullanıcılara iletildi.','success');
    document.getElementById('bot-msg').value = '';
  }
</script>
</body>
</html>
