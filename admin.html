<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>CIPHER Admin - Bulut Yönetimi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
</head>
<body class="bg-[#06080F] text-[#DDE8F8] p-8">
  <div id="admin-content" class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Kullanıcı Yönetimi (Supabase)</h1>
    
    <div class="bg-[#0C1220] p-6 rounded-2xl border border-[#1E2D45] mb-8">
      <div class="grid gap-4">
        <input id="u" type="text" placeholder="Kullanıcı Adı" class="bg-[#06080F] border border-[#1E2D45] p-3 rounded-xl outline-none focus:border-[#00FFB3]">
        <input id="d" type="text" placeholder="Görünen Ad" class="bg-[#06080F] border border-[#1E2D45] p-3 rounded-xl outline-none focus:border-[#00FFB3]">
        <input id="p" type="password" placeholder="Şifre" class="bg-[#06080F] border border-[#1E2D45] p-3 rounded-xl outline-none focus:border-[#00FFB3]">
        <button onclick="createUser()" class="bg-[#00FFB3] text-[#06080F] font-bold py-3 rounded-xl hover:opacity-90">Kullanıcıyı Kaydet</button>
      </div>
    </div>

    <div id="user-list" class="space-y-3">
      <div class="text-center text-[#7A8FA8]">Yükleniyor...</div>
    </div>
  </div>

  <script>
    async function init() {
      const pass = prompt('Admin Key:');
      if (pass !== CONFIG.ADMIN_KEY) {
        alert('Hatalı Key!');
        window.location.href = 'index.html';
        return;
      }
      loadUsers();
    }

    async function loadUsers() {
      const users = await DB.getAllUsers();
      const list = document.getElementById('user-list');
      if (users.length === 0) {
        list.innerHTML = '<div class="text-center text-[#7A8FA8]">Hiç kullanıcı bulunamadı.</div>';
        return;
      }
      list.innerHTML = users.map(u => `
        <div class="flex justify-between items-center p-4 bg-[#0C1220] border border-[#1E2D45] rounded-xl">
          <div>
            <div class="font-bold">${u.display_name}</div>
            <div class="text-xs text-[#7A8FA8]">@${u.username}</div>
          </div>
          <button onclick="deleteUser('${u.username}')" class="text-[#FF3D6B] text-sm font-bold">SİL</button>
        </div>
      `).join('');
    }

    async function createUser() {
      const u = document.getElementById('u').value.toLowerCase().trim();
      const d = document.getElementById('d').value.trim();
      const p = document.getElementById('p').value;

      if (!u || !p) return alert('Kullanıcı adı ve şifre boş olamaz!');

      try {
        const hash = await DB._sha256(p);
        await DB.createUser({
          username: u,
          display_name: d || u,
          password_hash: hash,
          locked: false,
          created_at: new Date().toISOString()
        });
        alert('Kullanıcı başarıyla eklendi!');
        document.getElementById('u').value = '';
        document.getElementById('p').value = '';
        loadUsers();
      } catch (e) {
        alert('Hata: ' + e.message);
      }
    }

    async function deleteUser(username) {
      if (!confirm(username + ' silinecek?')) return;
      await DB.deleteUser(username);
      loadUsers();
    }

    init();
  </script>
</body>
</html>
