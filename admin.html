<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CIPHER Admin — Kontrol Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  
  <style>
    body { background: #06080F; color: #DDE8F8; font-family: 'DM Sans', sans-serif; }
    .glass-card { background: #0C1220; border: 1px solid #1E2D45; border-radius: 20px; }
    .input-field { background: #06080F; border: 1px solid #1E2D45; color: #DDE8F8; padding: 12px; border-radius: 12px; outline: none; width: 100%; transition: 0.2s; }
    .input-field:focus { border-color: #00FFB3; }
    .btn-primary { background: #00FFB3; color: #062B1F; font-weight: 700; padding: 12px; border-radius: 12px; width: 100%; transition: 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  </style>
</head>
<body class="p-6">

  <div id="admin-auth" class="max-w-md mx-auto mt-20 text-center">
    <h1 style="font-family: 'Syne';" class="text-3xl mb-6">CIPHER ADMIN</h1>
    <input id="admin-pass" type="password" placeholder="Admin Şifresi" class="input-field mb-4 text-center">
    <button onclick="checkAuth()" class="btn-primary">Giriş Yap</button>
  </div>

  <div id="admin-panel" class="max-w-2xl mx-auto hidden">
    <header class="flex justify-between items-center mb-8">
      <h2 style="font-family: 'Syne';" class="text-2xl">Yönetim Paneli</h2>
      <button onclick="location.reload()" class="text-xs text-[#7A8FA8] hover:text-[#00FFB3]">Sistemi Yenile</button>
    </header>

    <div class="glass-card p-6 mb-8">
      <h3 class="font-bold mb-4 text-[#00FFB3]">Yeni Kullanıcı Oluştur</h3>
      <div class="grid gap-3">
        <input id="u" type="text" placeholder="Kullanıcı Adı (küçük harf)" class="input-field">
        <input id="d" type="text" placeholder="Görünen İsim" class="input-field">
        <input id="p" type="password" placeholder="Şifre" class="input-field">
        <button onclick="addUser()" class="btn-primary mt-2">Kullanıcıyı Kaydet</button>
      </div>
    </div>

    <div class="glass-card p-6">
      <h3 class="font-bold mb-4">Kayıtlı Kullanıcılar</h3>
      <div id="user-list" class="space-y-3">
        <div class="text-center py-4 text-[#7A8FA8]">Yükleniyor...</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Şifre Kontrolü (Senin istediğin 1453)
    function checkAuth() {
      const input = document.getElementById('admin-pass').value;
      if (input === '1453') {
        document.getElementById('admin-auth').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadUsers();
      } else {
        alert('Hatalı şifre!');
      }
    }

    // 2. Kullanıcıları Listele
    async function loadUsers() {
      try {
        const users = await DB.getAllUsers();
        const container = document.getElementById('user-list');
        
        if (!users || users.length === 0) {
          container.innerHTML = '<div class="text-center text-[#7A8FA8]">Kullanıcı yok.</div>';
          return;
        }

        container.innerHTML = users.map(u => `
          <div class="flex items-center justify-between p-4 bg-[#06080F] rounded-xl border border-[#1E2D45]">
            <div>
              <div class="font-bold text-sm">${u.display_name}</div>
              <div class="text-xs text-[#7A8FA8]">@${u.username}</div>
            </div>
            <button onclick="deleteUser('${u.username}')" class="text-[#FF3D6B] text-xs font-bold p-2 hover:bg-[#FF3D6B11] rounded-lg">SİL</button>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }

    // 3. Kullanıcı Ekle
    async function addUser() {
      const u = document.getElementById('u').value.toLowerCase().trim();
      const d = document.getElementById('d').value.trim();
      const p = document.getElementById('p').value;

      if (!u || !p) return alert('Kullanıcı adı ve şifre boş bırakılamaz!');

      try {
        // DB._sha256 db.js dosyanın içindeki fonksiyonu kullanır
        const hash = await DB._sha256(p);
        
        const newUser = {
          username: u,
          display_name: d || u,
          password_hash: hash,
          locked: false,
          created_at: new Date().toISOString()
        };

        await DB.createUser(newUser);
        alert('Kullanıcı Başarıyla Oluşturuldu!');
        
        // Formu temizle ve listeyi yenile
        document.getElementById('u').value = '';
        document.getElementById('p').value = '';
        loadUsers();
      } catch (e) {
        console.error(e);
        alert('Hata: Kullanıcı zaten var veya veritabanı hatası.');
      }
    }

    // 4. Kullanıcı Sil
    async function deleteUser(uname) {
      if (!confirm(uname + ' silinsin mi?')) return;
      try {
        await DB.deleteUser(uname);
        loadUsers();
      } catch (e) {
        alert('Silme hatası!');
      }
    }
  </script>
</body>
</html>
