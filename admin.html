<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CIPHER Admin — Kontrol Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    html,body{height:auto;overflow:auto;}
    body{min-height:100vh;background:#06080F;color:#DDE8F8;padding:0;}
    .field{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #1E2D45;background:#06080F;color:#DDE8F8;font-size:13px;outline:none;transition:border-color .2s;font-family:'DM Sans',sans-serif;}
    .field:focus{border-color:#00FFB3;}
    .btn-green{padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#00FFB3,#00C48A);color:#062B1F;font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:Syne,sans-serif;transition:opacity .15s;}
    .section{background:#0C1220;border:1px solid #1E2D45;border-radius:16px;padding:20px;margin-bottom:20px;}
    .label{display:block;font-size:10px;font-weight:600;color:#7A8FA8;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;margin-bottom:6px;text-transform:uppercase;}
    .user-card{padding:12px;background:#06080F;border:1px solid #1E2D45;border-radius:12px;margin-bottom:10px;}
    .hidden { display: none !important; }
  </style>
</head>
<body class="grid-bg">

<div id="admin-auth" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#06080F">
  <div style="width:100%;max-width:380px;padding:20px">
    <div style="text-align:center;margin-bottom:24px">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#FFD700,#FFA500);margin-bottom:12px;font-size:26px">⚡</div>
      <div style="font-family:Syne,sans-serif;font-size:24px;font-weight:800;color:#DDE8F8">CIPHER Admin</div>
    </div>
    <div class="section">
      <label class="label">ADMİN ANAHTARI</label>
      <input id="admin-key-input" type="password" class="field" placeholder="Giriş anahtarı..." onkeydown="if(event.key==='Enter')checkAdminKey()">
      <button onclick="checkAdminKey()" class="btn-green" style="width:100%;margin-top:12px">Giriş Yap</button>
    </div>
  </div>
</div>

<div id="admin-panel" class="hidden">
  <div style="border-bottom:1px solid #1E2D45;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;background:#0C1220;position:sticky;top:0;z-index:10">
    <div style="font-family:Syne,sans-serif;font-weight:700;color:#00FFB3">CIPHER Panel</div>
    <a href="index.html" style="font-size:12px;color:#7A8FA8">← Uygulamaya Dön</a>
  </div>

  <div style="max-width:800px;margin:0 auto;padding:20px">
    
    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">➕ Yeni Kullanıcı</h2>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <input id="new-username" class="field" placeholder="Kullanıcı Adı">
        <input id="new-password" type="password" class="field" placeholder="Şifre">
      </div>
      <button onclick="addUser()" class="btn-green" style="margin-top:14px;width:100%">Kaydet</button>
    </div>

    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:16px">👥 Kullanıcılar & Şifre İşlemleri</h2>
      <div id="users-table"></div>
    </div>

    <div class="section">
      <h2 style="font-family:Syne,sans-serif;margin-bottom:12px">🤖 Toplu Duyuru</h2>
      <textarea id="bot-msg" class="field" placeholder="Mesaj..." rows="2"></textarea>
      <button onclick="sendBotMessage()" class="btn-green" style="margin-top:10px;width:100%">Gönder</button>
    </div>
  </div>
</div>

<div id="toast-container" style="position:fixed;bottom:20px;right:16px;z-index:200"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/ui.js"></script>

<script>
  function checkAdminKey() {
    const k = document.getElementById('admin-key-input').value;
    if (k === '1453' || k === CONFIG.ADMIN_KEY) {
      document.getElementById('admin-auth').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
      loadUsers();
    } else { alert('Hatalı Anahtar!'); }
  }

  async function loadUsers() {
    const users = await DB.getAllUsers();
    const table = document.getElementById('users-table');
    table.innerHTML = '';
    
    users.forEach(u => {
      if(u.username === 'cipher_bot') return;
      const div = document.createElement('div');
      div.className = 'user-card';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div>
            <div style="font-weight:700">@${u.username}</div>
            <div style="font-size:11px;color:#7A8FA8">${u.display_name || u.username}</div>
          </div>
          <button onclick="deleteUser('${u.username}')" style="color:#FF3D6B;font-size:12px">Kullanıcıyı Sil</button>
        </div>
        <div style="display:flex;gap:8px">
          <input id="pw-${u.username}" type="password" class="field" placeholder="Yeni Şifre" style="height:34px">
          <button onclick="changePassword('${u.username}')" style="background:#1E2D45;padding:0 12px;border-radius:8px;font-size:11px">Şifreyi Güncelle</button>
        </div>
      `;
      table.appendChild(div);
    });
  }

  async function addUser() {
    const u = document.getElementById('new-username').value.trim().toLowerCase();
    const p = document.getElementById('new-password').value;
    if(!u || !p) return;
    const hash = await DB._sha256(p);
    await DB.createUser({ username: u, password_hash: hash, display_name: u, created_at: Date.now() });
    UI.toast('Kullanıcı eklendi');
    loadUsers();
  }

  async function changePassword(username) {
    const newPw = document.getElementById(`pw-${username}`).value;
    if(!newPw) return UI.toast('Yeni şifre girin', 'error');
    
    const hash = await DB._sha256(newPw);
    const user = await DB.getUser(username);
    user.password_hash = hash;
    // Eğer eski bozuk hash uyarısı varsa onu da temizle
    delete user.password_hash_broken; 
    
    await DB.updateUser(username, user);
    UI.toast(`@${username} şifresi güncellendi`, 'success');
    document.getElementById(`pw-${username}`).value = '';
  }

  async function deleteUser(u) { if(confirm('Silinsin mi?')) { await DB.deleteUser(u); loadUsers(); } }

  async function sendBotMessage() {
    const msg = document.getElementById('bot-msg').value;
    const users = await DB.getAllUsers();
    for(const u of users) {
      if(u.username === 'cipher_bot') continue;
      await DB.createMessage({ conv_id: ['cipher_bot', u.username].sort().join('_'), from: 'cipher_bot', text: "📢 " + msg, created_at: Date.now() });
    }
    UI.toast('Duyuru iletildi');
  }
</script>
</body>
</html>
